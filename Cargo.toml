[package]
name = "legume-mcp"
version = "0.4.4"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "A small stdio Model Context Protocol server for legume tools: tools, progress, cancellation and child runs"
repository = "https://github.com/causalpathlab/legume-mcp"
homepage = "https://github.com/causalpathlab/legume-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "json-rpc", "genomics"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[lib]
name = "legume_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The terminal session the view runs in (`<tool> mcp watch`).
legume-tui = { version = "0.3.15", default-features = false, optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }

# A tool's command line as an agent sets it (`legume_mcp::cli`).
clap = { version = "4.6", optional = true }

# The report's PDF, typeset in this program: Typst and the fonts it ships
# (`pdf`, for the `legume` binary: `cargo install legume-mcp --features
# pdf`). The tools take the library without it. Typst 0.15 needs Rust
# 1.92; the library without it keeps rust-version.
typst = { version = "0.15.1", optional = true }
typst-assets = { version = "0.15.1", features = ["fonts"], optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }

[features]
pdf = ["dep:typst", "dep:typst-assets", "dep:typst-layout", "dep:typst-pdf"]
tui = ["dep:legume-tui", "dep:ratatui"]
clap = ["dep:clap"]
# Background steps that run in a detachable session of the tool's own TUI
# (`Call::start_session_job`): a person attaches to watch them, and they
# outlive the server.
sessions = ["dep:legume-tui"]

[target.'cfg(unix)'.dependencies]
# geteuid and O_NOFOLLOW, to leave alone record files this user does not own.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The stand-in TUI a session job runs, and the terminal that attaches to it.
legume-tui = { version = "0.3.15", default-features = false, features = ["clap", "testing"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[[example]]
name = "session_job"
required-features = ["sessions"]

[[test]]
name = "session_jobs"
required-features = ["sessions"]

[[test]]
name = "watch_view"
required-features = ["tui"]

[[test]]
name = "cli"
required-features = ["clap"]
