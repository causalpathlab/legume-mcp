[package]
name = "legume-mcp"
version = "0.3.2"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "A small stdio Model Context Protocol server for legume tools: tools, progress, cancellation and child runs"
repository = "https://github.com/causalpathlab/legume-mcp"
homepage = "https://github.com/causalpathlab/legume-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "json-rpc", "genomics"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[lib]
name = "legume_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The terminal session the view runs in (`<tool> mcp watch`).
legume-tui = { version = "0.3.13", default-features = false, optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }

[features]
tui = ["dep:legume-tui", "dep:ratatui"]

[target.'cfg(unix)'.dependencies]
# geteuid and O_NOFOLLOW, to leave alone record files this user does not own.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "watch_view"
required-features = ["tui"]
